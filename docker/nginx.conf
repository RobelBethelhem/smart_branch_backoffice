# Smart Branch backoffice — nginx inside the container, port 4000.
# Serves the Vite build and forwards /api/* to the backend exactly like the Vite dev/preview
# proxy in vite.config.mjs: the first /api is removed, so
#   /api/api/login  →  http://backend:5000/api/login

# Docker's embedded DNS. "backend" is looked up per request (cached 10 s) instead of once at
# startup, so the proxy keeps working after the backend container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 4000;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Documents and Excel files are uploaded through /api (the backend allows 5 MB per file).
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness of nginx itself, for the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # Replace (never append to) any X-Forwarded-For sent by the browser, so it cannot claim
        # another address. The backend trusts this header only from the Docker network
        # (TRUST_PROXY), which gives every staff PC its own rate-limit budget.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # FlexCube postings can be slow; the Vite proxy had no timeout at all.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Vite writes content-hashed file names to assets/, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry page is revalidated on every load so a new release reaches users immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
